<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Голосовой читатель</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">♫</span>
        <div>
          <h1>Голосовой читатель</h1>
          <p>Озвучивание выделенного текста</p>
        </div>
      </div>
      <span id="state" class="state">Готово</span>
    </header>

    <section class="panel text-panel" aria-labelledby="text-title">
      <div class="row section-title">
        <label id="text-title" for="text">Текст для чтения</label>
        <button class="text-button" type="button" id="refresh" title="Взять выделение с активной вкладки">↻ Обновить</button>
      </div>
      <textarea id="text" spellcheck="false" placeholder="Выделите текст на сайте или вставьте его сюда…" rows="5" maxlength="60000"></textarea>
      <div class="row meta">
        <span id="counter">0 символов</span>
        <span>Максимум 60 000</span>
      </div>
    </section>

    <section class="controls" aria-label="Управление чтением">
      <button class="primary" id="play" type="button"><span aria-hidden="true">▶</span> Читать</button>
      <button class="secondary" id="pause" type="button" title="Пауза"><span aria-hidden="true">Ⅱ</span></button>
      <button class="secondary" id="resume" type="button" title="Продолжить"><span aria-hidden="true">▷</span></button>
      <button class="secondary stop" id="stop" type="button" title="Остановить"><span aria-hidden="true">■</span></button>
    </section>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

    <section class="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">Настройки</h2>
      <div class="row speed-row">
        <label for="rate">Скорость</label>
        <output id="rateValue" for="rate">1.0×</output>
      </div>
      <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
      <div class="row speed-markers"><span>Медленнее</span><span>Быстрее</span></div>

      <div class="fields">
        <div class="field">
          <label for="lang">Язык</label>
          <select id="lang">
            <option value="auto">Автоматически</option>
            <option value="ru-RU">Русский</option>
            <option value="en-US">English</option>
            <option value="hy-AM">Հայերեն</option>
          </select>
        </div>
        <div class="field">
          <label for="engine">Синтез речи</label>
          <select id="engine">
            <option value="auto">Автоматически</option>
            <option value="chrome">Chrome TTS</option>
            <option value="web">Веб-движок</option>
          </select>
        </div>
      </div>
      <div class="field voice-field">
        <label for="voice">Голос</label>
        <select id="voice"><option value="auto">Автовыбор голоса</option></select>
      </div>
      <p class="hint" id="voiceHint">Доступность голосов зависит от Chrome и операционной системы.</p>
    </section>

    <footer>
      <span>Выделите текст → правая кнопка → «Прочитать»</span>
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>8</kbd>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
